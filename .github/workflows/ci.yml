name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Unit and integration tests
        run: |
          pytest
          node --test tests/*.test.cjs
          for file in dashboard/assets/*.js dashboard/sw.js; do node --check "$file"; done
      - name: Build checked-in dashboard data
        run: python -m fpl_mvp build-site
      - name: Artifact and performance gates
        run: |
          python scripts/smoke_site.py dist
          python scripts/check_frontend.py
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser end-to-end regression
        run: |
          python scripts/qa_server.py --port 8011 > /tmp/fpl-qa-server.log 2>&1 &
          npm run test:e2e
      - name: Keep failed browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-traces
          path: test-results
          retention-days: 7

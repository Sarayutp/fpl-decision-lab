name: Refresh FPL Data and Deploy Pages

on:
  workflow_dispatch:
  schedule:
    # 07:17, 13:17, 19:17 and 01:17 in Bangkok (UTC+7).
    - cron: "17 0,6,12,18 * * *"
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FPL_TEAM_ID: "3647781"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test before publishing
        run: pytest
      - name: Refresh public FPL data and build site
        run: python -m fpl_mvp all --force-refresh
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

